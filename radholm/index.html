<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="author" content="Fredrik Radholm" />
    <meta
      name="description"
      content="Fredrik Radholm — Senior Software Engineer in Fintech. Links, contact and résumé."
    />
    <meta name="keywords" content="Fredrik Radholm, Software Engineer, Fintech, Swedish" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Fredrik Radholm" />
    <meta property="og:description" content="Senior Software Engineer in Fintech." />
    <meta property="og:url" content="https://radholm.com/" />
    <meta property="og:image" content="https://radholm.com/assets/radholm.png" />

    <link rel="canonical" href="https://radholm.com/" />
    <style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --text: #1a1d21;
        --muted: #5b6470;
        --accent: #2563eb;
        --border: #e2e5ea;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.08);
        --radius: 14px;
        --maxw: 34rem;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Roboto", system-ui, -apple-system, "Segoe UI", Helvetica, Arial,
          sans-serif;
        font-weight: 300;
        line-height: 1.6;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem 1.25rem 4rem;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: var(--maxw);
        padding: clamp(1.5rem, 5vw, 2.75rem);
        text-align: center;
        position: relative;
        z-index: 1;
        overflow: hidden;
      }

      .banner {
        display: block;
        width: calc(100% + 2 * clamp(1.5rem, 5vw, 2.75rem));
        margin: calc(-1 * clamp(1.5rem, 5vw, 2.75rem)) calc(-1 * clamp(1.5rem, 5vw, 2.75rem)) 2rem;
        aspect-ratio: 640 / 480;
        height: auto;
        object-fit: cover;
      }

      .intro {
        margin-bottom: 2rem;
      }

      h1 {
        color: var(--text);
        font-size: clamp(2rem, 7vw, 2.75rem);
        font-weight: 300;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .title {
        color: var(--muted);
        font-size: clamp(1rem, 4vw, 1.2rem);
        margin-top: 0.5rem;
      }

      .links {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr));
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: var(--text);
        font-size: 1rem;
        text-decoration: none;
        transition:
          border-color 0.2s ease,
          color 0.2s ease,
          background-color 0.2s ease,
          transform 0.1s ease;
      }

      .btn:hover,
      .btn:focus-visible {
        border-color: var(--accent);
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 8%, transparent);
      }

      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .btn:active {
        transform: translateY(1px);
      }

      .icon {
        width: 1.25rem;
        height: 1.25rem;
        flex: none;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
    <link rel="preload" href="style.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="style.css" /></noscript>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png" />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />
    <title>Fredrik Radholm — Senior Software Engineer</title>
  </head>

    </main>
  </body>
</html>
